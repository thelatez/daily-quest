<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        .card {
            width: 350px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 20px 25px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: 600;
        }

        input[type="text"],
        input[type="password"] {
            width: 95%;
            max-width: 95%;
            padding: 8px;
            margin-top: 6px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        .btn {
            width: 100%;
            margin-top: 18px;
            padding: 10px;
            border-radius: 6px;
            border: none;
            color: white;
            background-color: #007bff;
            cursor: pointer;
            font-size: 1rem;
        }
        
        .error {
            color: red;
            margin-top: 10px;
            text-align: center;
        }

        .link {
            margin-top: 15px;
            text-align: center;
        }

        a {
            text-decoration: none;
            color: #007bff;
        }
    </style>
</head>

<body>
<div class="card">
    <h2>Register</h2>

    <form th:action="@{/register}" method="post" th:object="${form}">
        <label>Username</label>
        <input type="text" th:field="*{username}" />

        <label>Password</label>
        <input type="password" th:field="*{password}" />

        <label>Repeat Password</label>
        <input type="password" th:field="*{passwordRepeat}" />

        <button class="btn" type="submit">Create Account</button>

        <div class="error" th:if="${error}" th:text="${error}"></div>
    </form>


    <div class="link">
        <a th:href="@{/login}">Back to Login</a>
    </div>
</div>
</body>
</html>
