<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>New Daily</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>
	<h2>New daily</h2>
    <a href="/dailylist">Dailylist</a>
    <div>
		<form th:object="${daily}" th:action="@{/save}" action="#" method="post">
            
            <label for="name">Name</label>
            <input type="text" id="name" th:field="*{name}" /><br>

            <label for="description">Description</label>
            <input type="text" id="description" th:field="*{description}"/><br>

            <label for="startTime">Start time</label>
            <input type="time" id="startTime" th:field="*{startTime}"/><br>

            <label for="endTime">End time</label>
            <input type="time" id="endTime" th:field="*{endTime}"/><br>

            <label for="state">State</label>
            <select id="state" th:field="*{state.state_id}" class="form-control">
                <option th:each="s: ${states}"
                    th:value="${s.state_id}"
                    th:text="${s.name}">
                </option>
            </select><br>
            
            <input class="btn btn-success" type="submit" value="Add"></input>
        </form>
    </div>    	
</body>
</html>
