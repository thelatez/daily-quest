<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Quest List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>Daily Quests</h1>
        
        <!-- Add new task form -->
        <form class="mb-4" th:action="@{/newdaily}" method="post">
            <div class="input-group">
                <input type="text" class="form-control" name="description" placeholder="Enter new task">
                <button class="btn btn-primary" type="submit">Add Daily</button>
            </div>
        </form>

        <!-- Task list -->
        <div class="list-group">
            <div th:each="daily : ${dailies}" class="list-group-item d-flex justify-content-between align-items-center">
                <span th:text="${daily.description}">Task description</span>
                <div class="btn-group">
                    <form th:action="@{/completeDaily}" method="post" class="me-2">
                        <input type="hidden" name="daily_id" th:value="${daily.id}">
                        <button class="btn btn-success btn-sm" type="submit">Complete (not implemented)</button>
                    </form>
                    <form th:action="@{/deleteDaily}" method="post">
                        <input type="hidden" name="daily_id" th:value="${daily.id}">
                        <button class="btn btn-danger btn-sm" type="submit">Delete (not implemented)</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html></div>
